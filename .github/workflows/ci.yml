name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-review:
    runs-on: ubuntu-latest
    env:
      MOCK_AI_MODE: "true"
      NINEARM_API_KEY: ""
      GEMINI_API_KEY: ""
      GROQ_API_KEY: ""
      CEREBRAS_API_KEY: ""
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests
      - run: python -m ruff check backend scripts
      - run: python scripts/check_repo_guardrails.py
      - run: python scripts/generate_local_match_report.py

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test:unit
      - working-directory: frontend
        run: npm run test:integration
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm audit --audit-level=high
