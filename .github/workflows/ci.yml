name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  local-review:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests
      - run: python -m ruff check backend scripts
      - run: python scripts/check_repo_guardrails.py
      - run: python scripts/generate_local_match_report.py

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test:unit
      - working-directory: frontend
        run: npm run test:integration
      - working-directory: frontend
        run: npm run build
      - name: Resolve dependency audit findings
        working-directory: frontend
        run: npm audit fix --package-lock-only
      - working-directory: frontend
        run: npm audit --audit-level=high
      - name: Persist repaired dependency lock
        if: github.event_name == 'push'
        run: |
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "repository-maintenance"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update dependency lock"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
